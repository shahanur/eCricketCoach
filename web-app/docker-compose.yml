services:
  postgres:
    image: postgres:16-alpine
    container_name: ecricket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cricket_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cricket_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ecricketcoach}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: ecricket_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  aihub:
    build:
      context: ./aihub
      dockerfile: Dockerfile
    container_name: ecricket_aihub
    restart: unless-stopped
    environment:
      AIHUB_YOLO_MODEL: ${AIHUB_YOLO_MODEL:-yolo11n.pt}
    expose:
      - "8100"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    # cape-worker runs this same image, so it is built once.
    image: ecricket-server:latest
    container_name: ecricket_api
    restart: unless-stopped
    environment:
      PORT: 5001
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-cricket_user}:${POSTGRES_PASSWORD:-cricket_secret}@postgres:5432/${POSTGRES_DB:-ecricketcoach}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-shahanurreza@gmail.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AI_HUB_URL: http://aihub:8100
      # CAPE video analysis (cape-api + cape-worker, started via `--profile cape` in deploy.sh).
      CAPE_API_URL: ${CAPE_API_URL:-http://cape-api:8000}
      CAPE_API_KEY: ${CAPE_API_KEY:-}
      CAPE_UPLOAD_DIR: /var/cape-uploads
    volumes:
      - cape-uploads:/var/cape-uploads
    ports:
      - "5001:5001"
    depends_on:
      - postgres
      - redis
      - aihub

  cape-api:
    profiles: [cape]
    build:
      context: ../cape-api
    container_name: ecricket_cape_api
    restart: unless-stopped
    environment:
      CAPE_API_KEY: ${CAPE_API_KEY:-}
      CAPE_DEVICE: ${CAPE_DEVICE:-cuda}
      CAPE_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CAPE_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      CAPE_GEMINI_CONTACT: ${CAPE_GEMINI_CONTACT:-true}
      CAPE_GEMINI_TIMEOUT_SECONDS: ${CAPE_GEMINI_TIMEOUT_SECONDS:-90}
    volumes:
      - ../cape-api/weights:/app/weights:ro
      - cape-workspace:/app/cricket_workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  cape-worker:
    profiles: [cape]
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ecricket-server:latest
    container_name: ecricket_cape_worker
    restart: unless-stopped
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cricket_user}:${POSTGRES_PASSWORD:-cricket_secret}@postgres:5432/${POSTGRES_DB:-ecricketcoach}
      REDIS_URL: redis://redis:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      CAPE_API_URL: ${CAPE_API_URL:-http://cape-api:8000}
      CAPE_API_KEY: ${CAPE_API_KEY:-}
      CAPE_CONCURRENCY: ${CAPE_CONCURRENCY:-1}
      CAPE_TIMEOUT_MS: ${CAPE_TIMEOUT_MS:-600000}
      CAPE_GEMINI_SUMMARY: ${CAPE_GEMINI_SUMMARY:-false}
      CAPE_UPLOAD_DIR: /var/cape-uploads
    volumes:
      - cape-uploads:/var/cape-uploads
    depends_on:
      - postgres
      - redis
      - cape-api

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ecricket_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
  cape-uploads:
  cape-workspace:
