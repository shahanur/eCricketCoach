server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Allow large video uploads (device upload -> Google Drive backup) to pass through proxy
    client_max_body_size 600M;

    # Frontend Single Page App routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls directly to ecricket_api backend
    location /api/ {
        proxy_pass http://server:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 600M;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/auth/ {
        proxy_pass http://server:5001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
