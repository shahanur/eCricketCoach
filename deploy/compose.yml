name: ecricketcoach

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cricket_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cricket_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ecricketcoach}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/platform-api/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  aihub:
    build:
      context: ./services/ai-hub
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AIHUB_YOLO_MODEL: ${AIHUB_YOLO_MODEL:-yolo11n.pt}
    expose:
      - "8100"

  server:
    build:
      context: ./services/platform-api
      dockerfile: Dockerfile
    # cape-worker runs this same image, so it is built once.
    image: ecricket-server:latest
    restart: unless-stopped
    environment:
      PORT: 5001
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-cricket_user}:${POSTGRES_PASSWORD:-cricket_secret}@postgres:5432/${POSTGRES_DB:-ecricketcoach}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-shahanurreza@gmail.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VIDEO_ANALYSIS_MODEL: ${OPENAI_VIDEO_ANALYSIS_MODEL:-gpt-6.1-sol}
      OPENAI_MAX_VIDEO_SIZE_MB: ${OPENAI_MAX_VIDEO_SIZE_MB:-500}
      OPENAI_MAX_VIDEO_DURATION_SECONDS: ${OPENAI_MAX_VIDEO_DURATION_SECONDS:-180}
      OPENAI_OVERVIEW_FPS: ${OPENAI_OVERVIEW_FPS:-4}
      OPENAI_MAX_OVERVIEW_FRAMES: ${OPENAI_MAX_OVERVIEW_FRAMES:-36}
      OPENAI_CONTACT_CONTEXT_SECONDS: ${OPENAI_CONTACT_CONTEXT_SECONDS:-0.5}
      OPENAI_MAX_CONTACT_WINDOW_SECONDS: ${OPENAI_MAX_CONTACT_WINDOW_SECONDS:-2}
      OPENAI_MAX_CONTACT_WINDOW_FRAMES: ${OPENAI_MAX_CONTACT_WINDOW_FRAMES:-120}
      OPENAI_REQUEST_TIMEOUT_MS: ${OPENAI_REQUEST_TIMEOUT_MS:-240000}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_CAPE_TIMEOUT_MS: ${OPENAI_CAPE_TIMEOUT_MS:-180000}
      OPENAI_REPORTS_DIR: /var/openai-reports
      AI_HUB_URL: http://aihub:8100
      # CAPE video analysis (cape-api + cape-worker, started via `--profile cape` in deploy.sh).
      CAPE_API_URL: ${CAPE_API_URL:-http://cape-api:8000}
      CAPE_API_KEY: ${CAPE_API_KEY:-}
      CAPE_UPLOAD_DIR: /var/cape-uploads
      POSE_OVERLAY_API_URL: http://pose-overlay-api:8200
      POSE_OVERLAY_API_KEY: ${CAPE_API_KEY:-}
      POSE_OVERLAY_TIMEOUT_MS: ${POSE_OVERLAY_TIMEOUT_MS:-90000}
    volumes:
      - cape-uploads:/var/cape-uploads
      - openai-report-artifacts:/var/openai-reports
    ports:
      - "5001:5001"
    depends_on:
      - postgres
      - redis
      - aihub
      - pose-overlay-api

  pose-overlay-api:
    build:
      context: ./services/pose-overlay-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSE_OVERLAY_API_KEY: ${CAPE_API_KEY:-}
      POSE_OVERLAY_YOLO_MODEL: /weights/yolo11n-pose.pt
      CAPE_COACHING_RULES_PATH: /rules/coaching_rules.yaml
    expose:
      - "8200"
    volumes:
      - ./services/cape-api/weights:/weights:ro
      - ./services/cape-api/app/rules/coaching_rules.yaml:/rules/coaching_rules.yaml:ro

  cape-api:
    profiles: [cape]
    build:
      context: ./services/cape-api
    restart: unless-stopped
    environment:
      CAPE_API_KEY: ${CAPE_API_KEY:-}
      CAPE_DEVICE: ${CAPE_DEVICE:-cuda}
      CAPE_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CAPE_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      CAPE_GEMINI_CONTACT: ${CAPE_GEMINI_CONTACT:-true}
      CAPE_GEMINI_TIMEOUT_SECONDS: ${CAPE_GEMINI_TIMEOUT_SECONDS:-90}
      CAPE_GEMINI_CONTACT_LEAD_FRAMES: ${CAPE_GEMINI_CONTACT_LEAD_FRAMES:-1}
    volumes:
      - ./services/cape-api/weights:/app/weights:ro
      - cape-workspace:/app/cricket_workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  cape-worker:
    profiles: [cape]
    build:
      context: ./services/platform-api
      dockerfile: Dockerfile
    image: ecricket-server:latest
    restart: unless-stopped
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cricket_user}:${POSTGRES_PASSWORD:-cricket_secret}@postgres:5432/${POSTGRES_DB:-ecricketcoach}
      REDIS_URL: redis://redis:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      CAPE_API_URL: ${CAPE_API_URL:-http://cape-api:8000}
      CAPE_API_KEY: ${CAPE_API_KEY:-}
      CAPE_CONCURRENCY: ${CAPE_CONCURRENCY:-1}
      CAPE_TIMEOUT_MS: ${CAPE_TIMEOUT_MS:-600000}
      CAPE_GEMINI_SUMMARY: ${CAPE_GEMINI_SUMMARY:-true}
      CAPE_UPLOAD_DIR: /var/cape-uploads
    volumes:
      - cape-uploads:/var/cape-uploads
    depends_on:
      - postgres
      - redis
      - cape-api

  client:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
  cape-uploads:
  cape-workspace:
  openai-report-artifacts:
