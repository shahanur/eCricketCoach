# CAPE coaching rules (spec §11.3–11.5).
#
# Every range, severity band and message below is a starting HEURISTIC. They must be
# validated and tuned with club coaches before release. Evaluation is fully deterministic:
# the same metrics always produce the same faults.
#
# Check fields:
#   code, milestone, metric          metric is looked up as "<milestone>.<metric>", then "<metric>"
#   min / max                        ideal range (either may be omitted)
#   scale                            divisor for the deviation % (default: |violated bound|, or 1 if 0)
#   severity_bands: [low, medium]    deviation % upper limits for low / medium; above = high
#   message, recommendation, drill   fault text; `below:` / `above:` override any of these
#   verdict                          one-line verdict when this is the top fault
#   strength                         shown when in range; may use {value}
#   optional                         true = skip silently (not listed as unavailable) when the metric is missing
#
# pre_contact / post_contact checks read only "<milestone>.<metric>" (never the contact-frame value).
# Bat swing / follow-through arcs and bat swing speed are measured only when frames are chosen manually.
# Phase metrics: pose angles, head_front_knee_offset_pct, hands_height_pct / front_elbow_height_pct
# (% of torso, + = above the front shoulder), pre_contact.bat_swing_arc_deg / bat_swing_speed_kmh,
# post_contact.follow_through_arc_deg and post_contact.head_travel_pct (head movement after contact).

scoring:
  penalties: {high: 20, medium: 10, low: 5}
  default_severity_bands: [10, 25]

length_zones:
  pace:
    yorker: [0, 2]
    full: [2, 5]
    good_length: [5, 8]
    short_of_a_length: [8, 10]
    short: [10, null]
  spin:
    yorker: [0, 1]
    full: [1, 3]
    good_length: [3, 5]
    short_of_a_length: [5, 6]
    short: [6, null]

line_zones:
  down_leg: [null, -0.15]
  stumps: [-0.15, 0.15]
  off_stump_channel: [0.15, 0.45]
  wide_of_off: [0.45, null]

labels:
  length_zone:
    yorker: Yorker
    full: Full ball
    good_length: Good-length ball
    short_of_a_length: Short-of-a-length ball
    short: Short ball
  line_zone:
    down_leg: down the leg side
    stumps: on the stumps
    off_stump_channel: in the off-stump channel
    wide_of_off: wide of off stump
  positive:
    batting: Well played – technique looks sound at contact
    bowling: Sound action at delivery

batting:
  alignment:
    - code: chin_not_over_front_toe
      milestone: point_of_contact
      metric: chin_front_toe_offset_pct
      max: 20
      scale: 20
      message: The chin line is too far from the front toe at contact, reducing balance and control over the ball.
      recommendation: Move the head towards the ball so the chin finishes over the front toe.
      drill: Chin-over-toe shadow shots beside a vertical marker
      verdict: Head and front toe are not aligned at contact
      strength: "Chin line aligned over the front toe ({value:.0f}% offset)"
    - code: front_shoulder_off_target
      milestone: point_of_contact
      metric: front_shoulder_target_angle_deg
      max: 25
      scale: 25
      message: The shoulder line is not pointing towards the contact target, so the body opens or closes away from the intended swing path.
      recommendation: Keep the front shoulder directed towards the ball and intended target through contact.
      drill: Shoulder-to-target alignment drill with a floor marker
      verdict: Front shoulder is not aligned with the target
      strength: "Front shoulder points towards the contact target ({value:.0f}°)"
    - code: back_foot_not_parallel
      milestone: point_of_contact
      metric: back_foot_crease_angle_deg
      max: 20
      scale: 20
      message: The back foot is not parallel to the crease, weakening the base and changing hip alignment.
      recommendation: Set and hold the back foot parallel to the crease while transferring weight into the shot.
      drill: Back-foot crease-line setup drill
      verdict: Back foot is not locked parallel to the crease
      strength: "Back foot parallel to the crease ({value:.0f}°)"
    - code: front_elbow_low
      milestone: point_of_contact
      metric: front_elbow_height_pct
      min: -5
      scale: 20
      message: The front elbow is below shoulder level at contact, making a straight, vertical bat path harder to maintain.
      recommendation: Lead with a high front elbow and let the bat swing vertically beneath the hands.
      drill: High-elbow straight-bat throwdowns
      verdict: Front elbow is too low to guide a vertical swing
      strength: "Front elbow held at or above shoulder level ({value:.0f}%)"

  front_foot_drive:
    - code: front_knee
      milestone: point_of_contact
      metric: front_knee
      min: 110
      max: 150
      strength: "Front knee nicely flexed at contact ({value:.0f}°)"
      below:
        code: front_knee_collapsed
        message: Front knee is over-bent at contact, so weight is not transferring into the shot.
        recommendation: Stride to the pitch of the ball and keep the front knee softly flexed over the front foot.
        drill: Front-foot stride drill with cones
        verdict: Drive played with a collapsed front knee
      above:
        code: front_knee_locked
        message: Front leg is locked straight at contact, which blocks the hips from driving through the ball.
        recommendation: Let the front knee bend so your weight moves over the front foot as you hit.
        drill: Slow-motion shadow drives holding the finish
        verdict: Drive played with a locked front leg
    - code: head_falling_away
      milestone: point_of_contact
      metric: head_front_knee_offset_pct
      min: -10
      message: Head is behind the front knee at contact, so you are off balance and likely to hit in the air.
      recommendation: Lead with the head towards the ball and finish with your head over the front knee.
      drill: Drop-ball drives with the head over a cone
      verdict: Drive played with the head falling away
      strength: "Head well over the front knee at contact"
    - code: angled_bat
      milestone: point_of_contact
      metric: bat_angle_deg
      max: 20
      message: Bat is angled at contact, bringing the edge into play.
      recommendation: Keep the top hand in control and swing the bat straight down the line of the ball.
      drill: Straight-bat throwdowns along a chalk line
      verdict: Drive played with an angled bat
      strength: "Straight bat at contact ({value:.0f}°)"
    - code: short_stride
      milestone: point_of_contact
      metric: stride_m
      min: 0.6
      message: Stride is short, so you are not getting to the pitch of the ball.
      recommendation: Take a longer, decisive front-foot stride towards where the ball pitches.
      drill: Stride-to-the-marker drill
      verdict: Drive played without getting to the pitch of the ball
      strength: "Good stride to the pitch of the ball ({value:.2f} m)"
    - code: short_backswing
      milestone: pre_contact
      metric: bat_swing_arc_deg
      optional: true
      min: 45
      scale: 45
      message: The bat travels through only a small arc before contact, so the drive lacks swing and timing.
      recommendation: Take a fuller, controlled backlift and swing the bat through a longer arc into the ball.
      drill: Backlift-to-contact shadow swings with a pause at the top
      verdict: Short backswing into the drive
      strength: "Full swing into the ball ({value:.0f}°)"
    - code: checked_follow_through
      milestone: post_contact
      metric: follow_through_arc_deg
      optional: true
      min: 60
      scale: 60
      message: The bat stops soon after contact, so power is lost and the drive is checked.
      recommendation: Keep swinging through the line of the ball and hold a high, balanced finish.
      drill: Swing-through drives holding the finish for two seconds
      verdict: Checked follow-through on the drive
      strength: "Full follow-through ({value:.0f}°)"
    - code: falling_away_after_contact
      milestone: post_contact
      metric: head_front_knee_offset_pct
      optional: true
      min: -15
      scale: 20
      message: The head falls behind the front knee after contact, so the finish is off balance.
      recommendation: Keep the head over the front knee through the follow-through.
      drill: Hold-the-finish drives with the head over a cone
      verdict: Off-balance finish after the drive
      strength: "Balanced finish over the front knee"
    - code: low_backlift
      milestone: pre_contact
      metric: hands_height_pct
      optional: true
      min: -50
      scale: 40
      message: The hands stay low at the top of the backlift, so the bat has little time and distance to build speed into the drive.
      recommendation: Lift the hands to around shoulder height with a high front elbow before starting the downswing.
      drill: Backlift-and-hold drill with a one-second pause at the top of the backlift for one second
      verdict: Low backlift before the drive
      strength: "Hands lifted high in the backlift ({value:.0f}%)"
    - code: slow_bat_swing
      milestone: pre_contact
      metric: bat_swing_speed_kmh
      optional: true
      min: 35
      scale: 35
      message: The bat is travelling slowly just before contact, so the drive lacks power and is easy to mistime.
      recommendation: Accelerate the bat through the ball with a free swing of the arms, led by the top hand.
      drill: Underarm throwdowns hitting through a target gate at full speed
      verdict: Slow bat swing into the drive
      strength: "Good bat speed into the ball ({value:.0f} km/h est.)"
    - code: head_up_after_contact
      milestone: post_contact
      metric: head_travel_pct
      optional: true
      max: 15
      scale: 15
      message: The head moves away soon after contact, which pulls the shoulders and bat off line on the drive.
      recommendation: Keep the head still and watch the point of contact until the ball has left the bat.
      drill: Watch-the-contact drill holding the eyes on a marker for a count of two after each hit
      verdict: Head lifts after contact on the drive
      strength: "Head stays still through contact"
    - code: low_finish
      milestone: post_contact
      metric: front_elbow_height_pct
      optional: true
      min: -10
      scale: 30
      message: The front elbow stays low in the follow-through, so the bat face closes and the drive goes in the air or squirts square.
      recommendation: Finish with a high front elbow and the bat over the front shoulder.
      drill: High-finish shadow drives holding the end position
      verdict: Low finish on the drive
      strength: "High front-elbow finish ({value:.0f}%)"
    - code: front_leg_collapses_in_finish
      milestone: post_contact
      metric: front_knee
      optional: true
      min: 100
      scale: 30
      message: The front knee keeps bending after contact, so weight goes down instead of through the line of the ball.
      recommendation: Brace the front knee softly over the front foot as you follow through.
      drill: Front-foot hold drill freezing the finish over a cone
      verdict: Front leg collapses in the finish
      strength: "Stable front leg through the finish ({value:.0f} deg)"

  back_foot_drive:
    - code: back_knee_collapsed
      milestone: point_of_contact
      metric: back_knee
      min: 140
      message: Back knee collapses at contact, so you sink rather than standing tall.
      recommendation: Push back and across, staying tall on a firm back leg.
      drill: Back-and-across step drill against a wall
      verdict: Back-foot drive played without standing tall
      strength: "Standing tall on the back leg ({value:.0f}°)"
    - code: head_moving
      milestone: point_of_contact
      metric: head_travel_pct
      max: 10
      message: Head moves a lot between backlift and contact, making it hard to track the ball.
      recommendation: Keep the head still and level as you move back, then play the ball under your eyes.
      drill: Head-still throwdowns with a cap marker
      verdict: Back-foot drive played with a moving head
      strength: "Head still through the shot"
    - code: angled_bat
      milestone: point_of_contact
      metric: bat_angle_deg
      max: 20
      message: Bat is angled at contact, bringing the edge into play.
      recommendation: Keep a high front elbow and present the full face of the bat.
      drill: High-elbow punch drill off a tee
      verdict: Back-foot drive played with an angled bat
      strength: "Straight bat at contact ({value:.0f}°)"
    - code: short_backswing
      milestone: pre_contact
      metric: bat_swing_arc_deg
      optional: true
      min: 45
      scale: 45
      message: The bat travels through only a small arc before contact, so the drive lacks swing and timing.
      recommendation: Take a fuller, controlled backlift and swing the bat through a longer arc into the ball.
      drill: Backlift-to-contact shadow swings with a pause at the top
      verdict: Short backswing into the drive
      strength: "Full swing into the ball ({value:.0f}°)"
    - code: checked_follow_through
      milestone: post_contact
      metric: follow_through_arc_deg
      optional: true
      min: 60
      scale: 60
      message: The bat stops soon after contact, so power is lost and the drive is checked.
      recommendation: Keep swinging through the line of the ball and hold a high, balanced finish.
      drill: Swing-through drives holding the finish for two seconds
      verdict: Checked follow-through on the drive
      strength: "Full follow-through ({value:.0f}°)"
    - code: low_backlift
      milestone: pre_contact
      metric: hands_height_pct
      optional: true
      min: -50
      scale: 40
      message: The hands stay low at the top of the backlift, so the bat has little time and distance to build speed into the drive.
      recommendation: Lift the hands to around shoulder height with a high front elbow before starting the downswing.
      drill: Backlift-and-hold drill with a one-second pause at the top of the backlift for one second
      verdict: Low backlift before the drive
      strength: "Hands lifted high in the backlift ({value:.0f}%)"
    - code: slow_bat_swing
      milestone: pre_contact
      metric: bat_swing_speed_kmh
      optional: true
      min: 35
      scale: 35
      message: The bat is travelling slowly just before contact, so the drive lacks power and is easy to mistime.
      recommendation: Accelerate the bat through the ball with a free swing of the arms, led by the top hand.
      drill: Underarm throwdowns hitting through a target gate at full speed
      verdict: Slow bat swing into the drive
      strength: "Good bat speed into the ball ({value:.0f} km/h est.)"
    - code: head_up_after_contact
      milestone: post_contact
      metric: head_travel_pct
      optional: true
      max: 15
      scale: 15
      message: The head moves away soon after contact, which pulls the shoulders and bat off line on the drive.
      recommendation: Keep the head still and watch the point of contact until the ball has left the bat.
      drill: Watch-the-contact drill holding the eyes on a marker for a count of two after each hit
      verdict: Head lifts after contact on the drive
      strength: "Head stays still through contact"
    - code: sinking_after_contact
      milestone: post_contact
      metric: back_knee
      optional: true
      min: 130
      scale: 30
      message: The back knee collapses after contact, so you sink instead of staying tall over the ball.
      recommendation: Stay tall on a firm back leg until the follow-through is complete.
      drill: Back-foot punch drill holding a tall finish
      verdict: Sinks after contact on the back-foot drive
      strength: "Tall back leg through the finish ({value:.0f} deg)"

  forward_defence:
    - code: bat_pad_gap
      milestone: point_of_contact
      metric: bat_ahead_of_pad_cm
      min: 0
      scale: 10
      message: Bat is behind the front pad, leaving a gap between bat and pad.
      recommendation: Push the bat out in front of the pad, angled down, with soft hands.
      drill: Bat-and-pad together drill with a tennis ball
      verdict: Defence played with a bat-pad gap
      strength: "Bat in front of the pad, no gap"
    - code: head_behind_ball
      milestone: point_of_contact
      metric: head_front_knee_offset_pct
      min: 0
      scale: 20
      message: Head is behind the front knee, so the ball is not played under the eyes.
      recommendation: Lean the head and front shoulder into the line of the ball.
      drill: Kneeling forward-defence drill
      verdict: Defence played with the head behind the ball
      strength: "Head over the ball in defence"
    - code: angled_bat
      milestone: point_of_contact
      metric: bat_angle_deg
      max: 15
      message: Bat is not straight, so edges can carry to the slips.
      recommendation: Keep the bat face straight and the handle ahead of the blade.
      drill: Straight-bat defence along a chalk line
      verdict: Defence played with an angled bat
      strength: "Straight bat in defence ({value:.0f}°)"
    - code: front_knee
      milestone: point_of_contact
      metric: front_knee
      min: 110
      max: 150
      strength: "Front knee flexed and stable ({value:.0f}°)"
      below:
        code: front_knee_collapsed
        message: Front knee is over-bent, putting you off balance.
        recommendation: Make a controlled stride and keep the knee over the front foot.
        drill: Front-foot stride drill with cones
        verdict: Defence played with a collapsed front knee
      above:
        code: front_knee_locked
        message: Front leg is locked straight, so you cannot get your head over the ball.
        recommendation: Soften the front knee and let the weight come forward.
        drill: Slow-motion shadow defence
        verdict: Defence played with a locked front leg
    - code: short_stride
      milestone: point_of_contact
      metric: stride_m
      min: 0.5
      message: Stride is short, so the ball can turn or seam past the bat.
      recommendation: Get further forward to smother the ball where it pitches.
      drill: Stride-to-the-marker drill
      verdict: Defence played without getting forward
      strength: "Well forward in defence ({value:.2f} m)"
    - code: follow_through_in_defence
      milestone: post_contact
      metric: follow_through_arc_deg
      optional: true
      max: 45
      scale: 45
      message: The bat keeps travelling after contact, so the defensive stroke is played with hard hands.
      recommendation: Let the ball come to you and stop the bat at contact with soft hands.
      drill: Soft-hands defence dropping the ball at your feet
      verdict: Defence played with hard hands
      strength: "Bat stopped softly at contact"
    - code: big_swing_in_defence
      milestone: pre_contact
      metric: bat_swing_speed_kmh
      optional: true
      max: 40
      scale: 40
      message: The bat is coming down quickly before contact, so the defensive push turns into a hard-handed jab.
      recommendation: Use a short backlift and let the bat meet the ball softly, angled down.
      drill: Soft-hands defence dropping the ball at your feet
      verdict: Swinging hard in defence
      strength: "Controlled bat speed in defence ({value:.0f} km/h est.)"
    - code: head_up_after_contact
      milestone: post_contact
      metric: head_travel_pct
      optional: true
      max: 10
      scale: 10
      message: The head moves away soon after contact, which pulls the shoulders and bat off line on the defence.
      recommendation: Keep the head still and watch the point of contact until the ball has left the bat.
      drill: Watch-the-contact drill holding the eyes on a marker for a count of two after each hit
      verdict: Head lifts after contact on the defence
      strength: "Head stays still through contact"
    - code: falling_away_after_contact
      milestone: post_contact
      metric: head_front_knee_offset_pct
      optional: true
      min: -5
      scale: 20
      message: The head drops back behind the front knee after contact, so the weight is not held forward over the ball.
      recommendation: Hold the defensive position with the head over the front knee until the ball is dead.
      drill: Hold-the-pose defence, freezing for two seconds after contact
      verdict: Falls away after the defensive stroke
      strength: "Weight held forward after contact"

  backward_defence:
    - code: angled_bat
      milestone: point_of_contact
      metric: bat_angle_deg
      max: 15
      message: Bat is angled, so the ball can take the edge.
      recommendation: Keep the top hand high and the bat straight, with a soft bottom-hand grip.
      drill: Top-hand-only defence drill
      verdict: Back-foot defence played with an angled bat
      strength: "Straight bat in defence ({value:.0f}°)"
    - code: head_moving
      milestone: point_of_contact
      metric: head_travel_pct
      max: 8
      message: Head moves too much as you go back.
      recommendation: Move back and across with a still, level head.
      drill: Head-still throwdowns with a cap marker
      verdict: Back-foot defence played with a moving head
      strength: "Head still going back"
    - code: back_knee_collapsed
      milestone: point_of_contact
      metric: back_knee
      min: 140
      message: Back knee collapses, so you lose height and balance.
      recommendation: Stay tall on a firm back leg to get on top of the bounce.
      drill: Back-and-across step drill against a wall
      verdict: Back-foot defence played without standing tall
      strength: "Tall on the back leg ({value:.0f}°)"
    - code: follow_through_in_defence
      milestone: post_contact
      metric: follow_through_arc_deg
      optional: true
      max: 45
      scale: 45
      message: The bat keeps travelling after contact, so the defensive stroke is played with hard hands.
      recommendation: Let the ball come to you and stop the bat at contact with soft hands.
      drill: Soft-hands defence dropping the ball at your feet
      verdict: Defence played with hard hands
      strength: "Bat stopped softly at contact"
    - code: big_swing_in_defence
      milestone: pre_contact
      metric: bat_swing_speed_kmh
      optional: true
      max: 40
      scale: 40
      message: The bat is coming down quickly before contact, so the defence is played with hard hands.
      recommendation: Use a short backlift and let the ball come to a soft, straight bat.
      drill: Soft-hands defence dropping the ball at your feet
      verdict: Swinging hard in back-foot defence
      strength: "Controlled bat speed in defence ({value:.0f} km/h est.)"
    - code: head_up_after_contact
      milestone: post_contact
      metric: head_travel_pct
      optional: true
      max: 10
      scale: 10
      message: The head moves away soon after contact, which pulls the shoulders and bat off line on the defence.
      recommendation: Keep the head still and watch the point of contact until the ball has left the bat.
      drill: Watch-the-contact drill holding the eyes on a marker for a count of two after each hit
      verdict: Head lifts after contact on the defence
      strength: "Head stays still through contact"

  pull:
    - code: bat_plane
      milestone: point_of_contact
      metric: bat_angle_deg
      min: 60
      max: 100
      strength: "Bat rolling over the ball ({value:.0f}°)"
      below:
        code: bat_too_vertical
        message: Bat is too vertical at contact, so you hit upwards and risk a top edge.
        recommendation: Get on top of the bounce and swing the bat across the line, rolling the wrists.
        drill: Pull shots off a raised tee
        verdict: Pull played with an upward bat path
      above:
        code: bat_dropping
        message: Bat face is dropping below horizontal, so the ball goes straight up.
        recommendation: Keep the bat level and hit down on the ball.
        drill: Pull shots into a target net at ground level
        verdict: Pull played with a dropping bat
    - code: head_moving
      milestone: point_of_contact
      metric: head_travel_pct
      max: 8
      message: Head is moving between backlift and contact, so you lose sight of the ball.
      recommendation: Keep the head still and inside the line of the ball.
      drill: Head-still short-ball throwdowns
      verdict: Pull played with a moving head
      strength: "Head still into the pull"
    - code: back_leg_unbalanced
      milestone: point_of_contact
      metric: back_knee
      min: 120
      max: 175
      message: Back leg is not balanced under you at contact.
      recommendation: Transfer weight onto a flexed, stable back leg and pivot through the hips.
      drill: Pivot-and-pull shadow drill
      verdict: Pull played off balance
      strength: "Balanced on the back leg ({value:.0f}°)"
    - code: short_backswing
      milestone: pre_contact
      metric: bat_swing_arc_deg
      optional: true
      min: 45
      scale: 45
      message: The bat travels through only a small arc before contact, so the pull lacks swing and timing.
      recommendation: Take a fuller, controlled backlift and swing the bat through a longer arc into the ball.
      drill: Backlift-to-contact shadow swings with a pause at the top
      verdict: Short backswing into the pull
      strength: "Full swing into the ball ({value:.0f}°)"
    - code: checked_follow_through
      milestone: post_contact
      metric: follow_through_arc_deg
      optional: true
      min: 60
      scale: 60
      message: The bat stops soon after contact, so power is lost and the pull is checked.
      recommendation: Keep swinging through the line of the ball and hold a high, balanced finish.
      drill: Swing-through drives holding the finish for two seconds
      verdict: Checked follow-through on the pull
      strength: "Full follow-through ({value:.0f}°)"
    - code: low_backlift
      milestone: pre_contact
      metric: hands_height_pct
      optional: true
      min: -50
      scale: 40
      message: The hands stay low at the top of the backlift, so the bat has little time and distance to build speed into the pull.
      recommendation: Lift the hands to around shoulder height with a high front elbow before starting the downswing.
      drill: Backlift-and-hold drill with a one-second pause at the top of the backlift for one second
      verdict: Low backlift before the pull
      strength: "Hands lifted high in the backlift ({value:.0f}%)"
    - code: slow_bat_swing
      milestone: pre_contact
      metric: bat_swing_speed_kmh
      optional: true
      min: 40
      scale: 40
      message: The bat is travelling slowly just before contact, so the pull lacks power and is easy to mistime.
      recommendation: Accelerate the bat through the ball with a free swing of the arms, led by the top hand.
      drill: Underarm throwdowns hitting through a target gate at full speed
      verdict: Slow bat swing into the pull
      strength: "Good bat speed into the ball ({value:.0f} km/h est.)"
    - code: head_up_after_contact
      milestone: post_contact
      metric: head_travel_pct
      optional: true
      max: 20
      scale: 20
      message: The head moves away soon after contact, which pulls the shoulders and bat off line on the pull.
      recommendation: Keep the head still and watch the point of contact until the ball has left the bat.
      drill: Watch-the-contact drill holding the eyes on a marker for a count of two after each hit
      verdict: Head lifts after contact on the pull
      strength: "Head stays still through contact"

  cut:
    - code: bat_plane
      milestone: point_of_contact
      metric: bat_angle_deg
      min: 45
      max: 100
      message: Bat is not level enough to cut the ball along the ground.
      recommendation: Get the bat on top of the ball and strike down with a level blade.
      drill: Cut shots off a tee into a ground target
      verdict: Cut played with the wrong bat angle
      strength: "Bat level through the cut ({value:.0f}°)"
    - code: arms_cramped
      milestone: point_of_contact
      metric: front_elbow
      min: 120
      message: Arms are cramped, so there is no room to free the arms.
      recommendation: Move back and across to create room and extend the arms through the ball.
      drill: Width-cut throwdowns
      verdict: Cut played with cramped arms
      strength: "Arms extended through the cut ({value:.0f}°)"
    - code: head_moving
      milestone: point_of_contact
      metric: head_travel_pct
      max: 10
      message: Head is moving away from the line of the ball.
      recommendation: Keep the head still and over the ball as you strike.
      drill: Head-still throwdowns with a cap marker
      verdict: Cut played with a moving head
      strength: "Head still through the cut"
    - code: back_knee_collapsed
      milestone: point_of_contact
      metric: back_knee
      min: 130
      message: Back knee collapses, so you fall away from the shot.
      recommendation: Stay tall on the back foot and get on top of the bounce.
      drill: Back-and-across step drill against a wall
      verdict: Cut played falling away
      strength: "Stable base for the cut ({value:.0f}°)"
    - code: short_backswing
      milestone: pre_contact
      metric: bat_swing_arc_deg
      optional: true
      min: 45
      scale: 45
      message: The bat travels through only a small arc before contact, so the cut lacks swing and timing.
      recommendation: Take a fuller, controlled backlift and swing the bat through a longer arc into the ball.
      drill: Backlift-to-contact shadow swings with a pause at the top
      verdict: Short backswing into the cut
      strength: "Full swing into the ball ({value:.0f}°)"
    - code: checked_follow_through
      milestone: post_contact
      metric: follow_through_arc_deg
      optional: true
      min: 60
      scale: 60
      message: The bat stops soon after contact, so power is lost and the cut is checked.
      recommendation: Keep swinging through the line of the ball and hold a high, balanced finish.
      drill: Swing-through drives holding the finish for two seconds
      verdict: Checked follow-through on the cut
      strength: "Full follow-through ({value:.0f}°)"
    - code: low_backlift
      milestone: pre_contact
      metric: hands_height_pct
      optional: true
      min: -50
      scale: 40
      message: The hands stay low at the top of the backlift, so the bat has little time and distance to build speed into the cut.
      recommendation: Lift the hands to around shoulder height with a high front elbow before starting the downswing.
      drill: Backlift-and-hold drill with a one-second pause at the top of the backlift for one second
      verdict: Low backlift before the cut
      strength: "Hands lifted high in the backlift ({value:.0f}%)"
    - code: slow_bat_swing
      milestone: pre_contact
      metric: bat_swing_speed_kmh
      optional: true
      min: 35
      scale: 35
      message: The bat is travelling slowly just before contact, so the cut lacks power and is easy to mistime.
      recommendation: Accelerate the bat through the ball with a free swing of the arms, led by the top hand.
      drill: Underarm throwdowns hitting through a target gate at full speed
      verdict: Slow bat swing into the cut
      strength: "Good bat speed into the ball ({value:.0f} km/h est.)"
    - code: head_up_after_contact
      milestone: post_contact
      metric: head_travel_pct
      optional: true
      max: 15
      scale: 15
      message: The head moves away soon after contact, which pulls the shoulders and bat off line on the cut.
      recommendation: Keep the head still and watch the point of contact until the ball has left the bat.
      drill: Watch-the-contact drill holding the eyes on a marker for a count of two after each hit
      verdict: Head lifts after contact on the cut
      strength: "Head stays still through contact"

  sweep:
    - code: front_knee_not_low
      milestone: point_of_contact
      metric: front_knee
      min: 60
      max: 110
      message: Front knee is not bent the right amount to get low and stable.
      recommendation: Get down low with the front knee well bent over the line of the ball.
      drill: Kneeling sweep drill
      verdict: Sweep played without getting low
      strength: "Low, stable base ({value:.0f}°)"
    - code: head_behind_ball
      milestone: point_of_contact
      metric: head_front_knee_offset_pct
      min: -10
      message: Head is behind the front knee, so you lose sight of the ball.
      recommendation: Get your head over the front knee and close to the line of the ball.
      drill: Sweep drill with a cone at the front knee
      verdict: Sweep played with the head behind the ball
      strength: "Head over the front knee"
    - code: bat_plane
      milestone: point_of_contact
      metric: bat_angle_deg
      min: 60
      max: 110
      message: Bat is not horizontal enough, risking a top edge.
      recommendation: Sweep with a horizontal bat and roll the wrists over the ball.
      drill: Sweep throwdowns off a short length
      verdict: Sweep played with the wrong bat angle
      strength: "Horizontal bat in the sweep ({value:.0f}°)"
    - code: head_moving
      milestone: point_of_contact
      metric: head_travel_pct
      max: 15
      message: Head moves a lot into the sweep.
      recommendation: Commit early and keep the head still as you go down.
      drill: Kneeling sweep drill
      verdict: Sweep played with a moving head
      strength: "Head still into the sweep"
    - code: short_backswing
      milestone: pre_contact
      metric: bat_swing_arc_deg
      optional: true
      min: 45
      scale: 45
      message: The bat travels through only a small arc before contact, so the sweep lacks swing and timing.
      recommendation: Take a fuller, controlled backlift and swing the bat through a longer arc into the ball.
      drill: Backlift-to-contact shadow swings with a pause at the top
      verdict: Short backswing into the sweep
      strength: "Full swing into the ball ({value:.0f}°)"
    - code: checked_follow_through
      milestone: post_contact
      metric: follow_through_arc_deg
      optional: true
      min: 60
      scale: 60
      message: The bat stops soon after contact, so power is lost and the sweep is checked.
      recommendation: Keep swinging through the line of the ball and hold a high, balanced finish.
      drill: Swing-through drives holding the finish for two seconds
      verdict: Checked follow-through on the sweep
      strength: "Full follow-through ({value:.0f}°)"
    - code: slow_bat_swing
      milestone: pre_contact
      metric: bat_swing_speed_kmh
      optional: true
      min: 30
      scale: 30
      message: The bat is travelling slowly just before contact, so the sweep lacks power and is easy to mistime.
      recommendation: Accelerate the bat through the ball with a free swing of the arms, led by the top hand.
      drill: Underarm throwdowns hitting through a target gate at full speed
      verdict: Slow bat swing into the sweep
      strength: "Good bat speed into the ball ({value:.0f} km/h est.)"
    - code: head_up_after_contact
      milestone: post_contact
      metric: head_travel_pct
      optional: true
      max: 15
      scale: 15
      message: The head moves away soon after contact, which pulls the shoulders and bat off line on the sweep.
      recommendation: Keep the head still and watch the point of contact until the ball has left the bat.
      drill: Watch-the-contact drill holding the eyes on a marker for a count of two after each hit
      verdict: Head lifts after contact on the sweep
      strength: "Head stays still through contact"
    - code: standing_up_early
      milestone: post_contact
      metric: front_knee
      optional: true
      max: 120
      scale: 30
      message: The front knee straightens soon after contact, so the body lifts and the ball is hit in the air.
      recommendation: Stay down on a bent front knee until the follow-through is complete.
      drill: Kneeling sweep drill holding the low finish
      verdict: Stands up too early out of the sweep
      strength: "Stays low through the sweep ({value:.0f} deg)"

bowling:
  pace:
    - code: front_leg_not_braced
      milestone: release
      metric: front_knee
      min: 160
      message: Front leg collapses at front-foot contact, so you lose pace and bounce.
      recommendation: Land on a firm, braced front leg and pull through over it.
      drill: Braced-front-leg run-throughs
      verdict: Front leg collapsing at delivery
      strength: "Braced front leg at delivery ({value:.0f}°)"
    - code: bent_bowling_arm
      milestone: release
      metric: back_elbow
      min: 165
      severity_bands: [3, 6]
      message: Bowling arm appears bent at release.
      recommendation: Keep the bowling arm straight through the delivery swing; have a coach check the action.
      drill: Straight-arm bowling against a wall
      verdict: Bowling arm bent at release
      strength: "Straight bowling arm ({value:.0f}°)"
    - code: low_release
      milestone: release
      metric: release_height_m
      min: 1.9
      message: Release point is low, reducing bounce.
      recommendation: Stand tall at the crease and release the ball at the top of the arc.
      drill: High-release target bowling
      verdict: Low release point
      strength: "High release point ({value:.2f} m)"
  spin:
    - code: front_leg_not_braced
      milestone: release
      metric: front_knee
      min: 140
      message: Front leg is collapsing at delivery, so you cannot pivot over it.
      recommendation: Land on a stable front leg and rotate over it.
      drill: Front-leg pivot drill
      verdict: Front leg collapsing at delivery
      strength: "Stable front leg at delivery ({value:.0f}°)"
    - code: bent_bowling_arm
      milestone: release
      metric: back_elbow
      min: 165
      severity_bands: [3, 6]
      message: Bowling arm appears bent at release.
      recommendation: Keep the bowling arm straight; have a coach check the action.
      drill: Straight-arm bowling against a wall
      verdict: Bowling arm bent at release
      strength: "Straight bowling arm ({value:.0f}°)"
    - code: low_release
      milestone: release
      metric: release_height_m
      min: 1.7
      message: Release point is low, which flattens the trajectory.
      recommendation: Stay tall and release over the top to get dip and drift.
      drill: Bowling over a raised rope
      verdict: Low release point
      strength: "High release point ({value:.2f} m)"
  # Delivery checks apply to every bowler_type. value = length_m / line offset (m, + = off side);
  # expected = the good-length range for the bowler_type / the good-line range.
  delivery:
    - code: length
      milestone: pitching_point
      field: length_zone
      good: [good_length]
      strength: "Good length ({value:.1f} m from the stumps)"
      zones:
        yorker:
          code: length_yorker
          severity: low
          message: Ball pitched on a yorker length, which is easy to miss and turn into a full toss.
          recommendation: Use the yorker as a variation and aim for a good length as your stock ball.
          drill: Target-zone bowling with a good-length mat
        full:
          code: length_full
          severity: medium
          message: Ball pitched too full, giving the batter an easy drive.
          recommendation: Pull your length back slightly and aim at the good-length zone.
          drill: Target-zone bowling with a good-length mat
        short_of_a_length:
          code: length_short_of_a_length
          severity: low
          message: Ball pitched just short of a good length, letting the batter go back.
          recommendation: Pitch the ball a little fuller to make the batter play forward.
          drill: Target-zone bowling with a good-length mat
        short:
          code: length_short
          severity: high
          message: Ball pitched short, which is easy to pull or cut.
          recommendation: Bowl fuller and use the short ball only as a planned variation.
          drill: Target-zone bowling with a good-length mat
    - code: line
      milestone: pitching_point
      field: line_zone
      good: [stumps, off_stump_channel]
      strength: "Good line ({value:+.2f} m from middle stump)"
      zones:
        down_leg:
          code: line_down_leg
          severity: high
          message: Ball pitched down the leg side, giving away runs.
          recommendation: Align your run-up and front foot towards off stump.
          drill: Channel bowling between two cones
        wide_of_off:
          code: line_wide_of_off
          severity: medium
          message: Ball pitched wide of off stump, so the batter can leave it.
          recommendation: Bring your line in to the off-stump channel to make the batter play.
          drill: Channel bowling between two cones
